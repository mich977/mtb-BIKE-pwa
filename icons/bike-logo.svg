<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Dark OLED Background -->
  <rect width="100" height="100" rx="24" fill="#070A12" />
  <rect x="2" y="2" width="96" height="96" rx="22" stroke="#10B981" stroke-width="2" stroke-opacity="0.4" />
  
  <!-- Outer glowing bike gear teeth circle -->
  <circle cx="50" cy="50" r="38" stroke="#10B981" stroke-width="3" stroke-dasharray="6 4" />
  
  <!-- Inner Racing Accent -->
  <circle cx="50" cy="50" r="28" fill="#0D121F" stroke="#F97316" stroke-width="2.5" />
  
  <!-- Gamma Greek Letter γ with modern athletic stroke -->
  <path d="M41 33 C41 42, 45 52, 50 63 C52 67, 54 71, 55 75 C56 78, 55 80, 52 80 C49 80, 48 78, 48 75 C48 70, 52 64, 56 56 C60 48, 63 41, 63 33" 
        stroke="#10B981" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
